# Prismatix — nginx reverse proxy for WILDCARD subdomains behind Cloudflare.
# Enables Phase-6 tenant subdomain routing:  <slug>.prismatix.tech  →  the tenant workspace.
#
# This is the Cloudflare-fronted variant of prismatix-domain.conf. prismatix.tech is proxied by
# Cloudflare (orange cloud), so:
#   - EDGE TLS  (browser ⇄ Cloudflare) is Cloudflare Universal SSL — free, auto, covers the apex
#     AND the first-level wildcard *.prismatix.tech. No certbot at the edge.
#   - ORIGIN TLS (Cloudflare ⇄ this nginx) uses a Cloudflare **Origin CA** cert, issued once for
#     `*.prismatix.tech` + `prismatix.tech`, valid 15 years, free. It is trusted ONLY by Cloudflare,
#     so set the Cloudflare SSL/TLS mode to **Full (Strict)**.
#
# See docs/SUBDOMAIN-ROUTING-SETUP.md for the full runbook (DNS wildcard record, Origin cert,
# APP_BASE_DOMAIN env). This file REPLACES prismatix-domain.conf once wildcard routing is on.
#
# Install (on the VPS):
#   sudo install -d -m 700 /etc/nginx/cloudflare
#   # paste the Origin CA cert + key created in the Cloudflare dashboard:
#   sudo tee /etc/nginx/cloudflare/prismatix-origin.pem  >/dev/null   # <-- certificate
#   sudo tee /etc/nginx/cloudflare/prismatix-origin.key  >/dev/null   # <-- private key
#   sudo chmod 600 /etc/nginx/cloudflare/prismatix-origin.key
#   sudo cp deploy/nginx/prismatix-wildcard.conf /etc/nginx/sites-available/prismatix
#   sudo ln -sf /etc/nginx/sites-available/prismatix /etc/nginx/sites-enabled/prismatix
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

# ---- http :80 — redirect to https (Cloudflare already does this at the edge; this covers
#       any direct-to-origin request and lets `nginx -t` pass without a bare :80 app block). ----
server {
    listen 80;
    listen [::]:80;
    server_name prismatix.tech *.prismatix.tech;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# ---- https :443 — the app, for the apex AND every <slug>.prismatix.tech subdomain. ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prismatix.tech *.prismatix.tech;   # apex + first-level wildcard

    server_tokens off;

    # Cloudflare Origin CA cert (wildcard). Trusted by Cloudflare only → SSL mode must be Full (Strict).
    ssl_certificate     /etc/nginx/cloudflare/prismatix-origin.pem;
    ssl_certificate_key /etc/nginx/cloudflare/prismatix-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The app caps uploads at 10 MB; nginx defaults to 1 MB, which would break them.
    client_max_body_size 12m;

    location / {
        proxy_pass         http://127.0.0.1:4000;   # the Node app, bound to loopback
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;  # the ORIGINAL <slug>.prismatix.tech — the app
                                                     # reads this to resolve the tenant (host.ts)
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;   # app reads this for SECURE/HSTS
        proxy_read_timeout 300s;
    }
}

# NOTE: forwarding the real client IP.
# Behind Cloudflare, $remote_addr is a Cloudflare edge IP. The app's rate-limiter uses
# X-Forwarded-For with TRUST_PROXY=1 (one hop). If you want the TRUE visitor IP in logs/limits,
# restore it from Cloudflare's CF-Connecting-IP via ngx_http_realip_module + Cloudflare's published
# IP ranges (set_real_ip_from …; real_ip_header CF-Connecting-IP;). Optional hardening, not required
# for subdomain routing to work.
